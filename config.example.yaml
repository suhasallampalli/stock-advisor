# Copy to config.yaml and tune.  Values here are safe defaults, not advice.

llm:
  # Enable the Claude-written daily narrative. Rule signals still run if false.
  enabled: true
  # Let Claude pull recent headlines for held/watchlist names via web search.
  use_web_search: true

market:
  exchange_suffix: ".NS"          # ".NS" = NSE, ".BO" = BSE (yfinance convention)
  lookback_days: 400              # history pulled for indicator calculation
  # Benchmark indices for the market-open brief (previous day move + today's
  # gap). Tickers are yfinance/Yahoo Finance symbols — an index that fails to
  # resolve is skipped (logged), not fatal. Adjust to taste.
  indices:
    - name: "NIFTY 50"
      ticker: "^NSEI"
    - name: "SENSEX"
      ticker: "^BSESN"
    - name: "NIFTY BANK"
      ticker: "^NSEBANK"
    - name: "NIFTY IT"
      ticker: "^CNXIT"
    - name: "NIFTY MIDCAP 100"
      ticker: "^CNXMDCP"
    - name: "NIFTY FIN SERVICE"
      ticker: "NIFTY_FIN_SERVICE.NS"
  # NSE trading holidays for the current year (YYYY-MM-DD). Sessions are
  # skipped on these dates. Update yearly from the NSE holiday calendar.
  holidays:
    - 2026-01-26
    - 2026-03-06
    - 2026-03-25
    - 2026-04-03
    - 2026-04-14
    - 2026-05-01
    - 2026-08-15
    - 2026-10-02
    - 2026-11-09
    - 2026-12-25

indicators:
  sma_fast: 20
  sma_slow: 50
  sma_trend: 200
  rsi_period: 14
  rsi_oversold: 32
  rsi_overbought: 70
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  breakout_window: 20            # days for support/resistance & 20d high/low

signals:
  # Suggest trimming any single holding worth more than this share of the book.
  concentration_trim_pct: 22
  # Book partial profit when unrealised gain exceeds this and momentum fades.
  profit_take_pct: 30
  # Chandelier-exit multiple of ATR below the recent high -> STOPLOSS_HIT.
  atr_stop_mult: 3.0
  # Hard stop: flag if price is this far below your average cost.
  hard_stop_pct: 12
  # Overnight gap (%) on a holding that triggers an "attention" flag.
  gap_alert_pct: 4

watchlist_file: data/watchlist.txt
# NSE F&O (futures & options) underlying stocks, for the market-open gap-up/
# gap-down scan. NSE revises this list every quarter — refresh it from
# nseindia.com's published F&O underlying list when they do.
fno_list_file: data/fno_stocks.txt

report:
  # Max symbols shown per section in the email.
  max_rows: 40
  # Minimum |open vs prev close| % to count as a gap mover in the market-open
  # F&O scan. Smaller moves are noise, not gaps.
  min_gap_pct: 0.5
  # Of the gap movers, how many per side (gainers/losers) get an LLM-written
  # "probable reason" (one batched call covers all of them). The rest still
  # show in the table with prices/gap % but no reason, to bound LLM cost/time.
  max_gap_reason_rows: 15
